<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tabak İz: Okul yemeğinde israfı ölç, azalt</title>
  <meta name="description" content="Okul yemekhanesinde tabak fotoğrafını Gemini ile analiz edip artığı ölçen, çocuğa oyunlaştırılmış geri bildirim ve mutfağa menü önerisi veren uygulama.">
  <meta name="theme-color" content="#1f4d3a">
  <script>
    // Kayıtlı tema ve dili sayfa çizilmeden uygula (açılışta yanıp sönmeyi önler).
    try {
      const t = localStorage.getItem('tabakiz.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      const l = localStorage.getItem('tabakiz.lang'); if (l) document.documentElement.lang = l;
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tabak İz">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="34" height="34">
      <div><strong>Tabak İz</strong><small id="school-name">Pilot İlkokulu</small></div>
    </div>
    <div class="topbar-actions">
      <span id="mode-badge" class="badge">…</span>
      <button class="icon-btn" data-action="help" data-i18n-aria="Jüri turunu başlat" aria-label="Jüri turunu başlat"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.8v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="currentColor"/></svg></button>
      <div class="lang-wrap">
        <button id="lang-btn" class="icon-btn lang-btn" data-action="lang-menu" aria-haspopup="menu" aria-controls="lang-menu">TR</button>
        <div id="lang-menu" class="lang-menu" role="menu" hidden></div>
      </div>
      <button id="theme-toggle" class="icon-btn" data-action="theme" aria-label="Tema"></button>
      <button id="open-settings" class="icon-btn" data-i18n-aria="Ayarlar" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <section id="view-measure" class="view" data-view="measure"></section>
    <section id="view-class" class="view" data-view="class" hidden></section>
    <section id="view-kitchen" class="view" data-view="kitchen" hidden></section>
    <section id="view-impact" class="view" data-view="impact" hidden></section>
    <section id="view-evidence" class="view" data-view="evidence" hidden></section>
  </main>

  <nav class="tabbar" data-i18n-aria="Bölümler" aria-label="Bölümler">
    <button data-tab="measure" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg><span data-i18n="Ölç">Ölç</span></button>
    <button data-tab="class"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4.5 10c3 1 4 3 7 2s4 1 8-1M8 17c2-1 4 0 6-1"/></svg><span data-i18n="Sınıf">Sınıf</span></button>
    <button data-tab="kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M9 20V6M13 20v-7M17 20V9M3 20h18"/></svg><span data-i18n="Mutfak">Mutfak</span></button>
    <button data-tab="impact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-5-3-8-7-8-11a8 8 0 0 1 8-6 8 8 0 0 1 8 6c0 4-3 8-8 11Z M12 8v8M8.5 12.5 12 16l3.5-3.5"/></svg><span data-i18n="Etki">Etki</span></button>
    <button data-tab="evidence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z M9 12l2 2 4-4 M9 17h6"/></svg><span data-i18n="Kanıt">Kanıt</span></button>
  </nav>

  <dialog id="settings-dialog" class="sheet"></dialog>
  <dialog id="welcome-dialog" class="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="print-root" aria-hidden="true"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
